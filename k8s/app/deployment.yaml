# =============================================================================
# FastAPI Application Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: anomaly-lab
  labels:
    app: fastapi
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
        component: api
      annotations:
        # Prometheus auto-discovery
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fastapi
        image: anomaly-lab/fastapi:latest
        imagePullPolicy: Never  # Use local K3D image
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REPORT_COMPLEXITY
          value: "5000"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
# =============================================================================
# Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: anomaly-lab
  labels:
    app: fastapi
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
    name: http
  selector:
    app: fastapi
# HPA: ver k8s/hpa/ (modo escolhido por HPA_MODE no .env; aplicado pelo Makefile)
