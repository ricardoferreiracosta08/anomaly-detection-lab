# =============================================================================
# Grafana Datasource ConfigMap (auto-provision Prometheus)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: anomaly-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
# =============================================================================
# Grafana Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: anomaly-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "${GRAFANA_ADMIN_PASSWORD}"     # do .env (renderizado por bin/render.sh)
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
# =============================================================================
# Dashboard Provider (auto-load dashboards from /var/lib/grafana/dashboards)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: anomaly-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
# =============================================================================
# Dashboard: Anomaly Detection Lab
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: anomaly-lab
data:
  anomaly-lab.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Latência p95 (segundos)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "s", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"anomaly-lab\"}[30s])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"anomaly-lab\"}[30s])) by (le))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "title": "CPU por Pod (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "percent", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"anomaly-lab\", container=\"fastapi\"}[30s])) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Memória por Pod (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "decmbytes", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"anomaly-lab\", container=\"fastapi\"}) by (pod) / 1024 / 1024",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Réplicas (HPA)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "orange" }, "custom": { "fillOpacity": 20 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"anomaly-lab\", deployment=\"fastapi-app\"})",
              "legendFormat": "réplicas disponíveis",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "red" }, "unit": "percent", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\", status=~\"5..\"}[30s])) / clamp_min(sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])), 0.001) * 100",
              "legendFormat": "5xx error %",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Requests In Progress",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress{namespace=\"anomaly-lab\"}) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request Rate por Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])) by (endpoint, method)",
              "legendFormat": "{{method}} {{endpoint}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["anomaly-lab", "kubernetes"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Anomaly Detection Lab",
      "uid": "anomaly-lab-main"
    }
  online-detector.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "title": "Score do detector online (razão score/limiar; >1 = alerta)",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10,
                "scaleDistribution": {
                  "type": "log",
                  "log": 10
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max by (detector) (anomaly_score{namespace=\"anomaly-lab\"})",
              "legendFormat": "{{detector}}",
              "refId": "A"
            }
          ],
          "description": "Escala log: a linha tracejada em 1 é o limiar dinâmico (μ+K·σ, |z−μ|>3σ no EWMA, distância>eps no DBSCAN); acima dela = alerta. Score 0 (ponto típico) não aparece em escala log."
        },
        {
          "title": "Alertas por detector",
          "type": "state-timeline",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "normal", "color": "gray", "index": 0 },
                    "1": { "text": "alerta", "color": "red", "index": 1 }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max by (detector) (anomaly_alert{namespace=\"anomaly-lab\"})",
              "legendFormat": "{{detector}}",
              "refId": "A"
            }
          ],
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8
          }
        },
        {
          "title": "anomaly_level (métrica do HPA) × réplicas",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max by (detector) (anomaly_level{namespace=\"anomaly-lab\"})",
              "legendFormat": "level {{detector}}",
              "refId": "A"
            },
            {
              "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"anomaly-lab\", horizontalpodautoscaler=\"fastapi-hpa\"})",
              "legendFormat": "réplicas desejadas (HPA)",
              "refId": "B"
            },
            {
              "expr": "max(kube_deployment_status_replicas_available{namespace=\"anomaly-lab\", deployment=\"fastapi-app\"})",
              "legendFormat": "réplicas disponíveis",
              "refId": "C"
            }
          ],
          "description": "O HPA proativo (modos B/D) usa anomaly_level do detector escolhido; desejadas = ceil(atuais × level / ANOMALY_TARGET)."
        },
        {
          "title": "Latência p95 e requisições/s (contexto)",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"anomaly-lab\"}[30s])) by (le))",
              "legendFormat": "p95 (s)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])) / 100",
              "legendFormat": "req/s ÷ 100",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Entradas do detector (as 4 features)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "detector_input{namespace=\"anomaly-lab\"}",
              "legendFormat": "{{feature}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list"
            }
          }
        },
        {
          "title": "Saúde do detector",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10
              },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "time() - max(detector_last_success_timestamp{namespace=\"anomaly-lab\"})",
              "legendFormat": "segundos desde a última coleta",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(detector_step_seconds_bucket{namespace=\"anomaly-lab\"}[1m])) by (le))",
              "legendFormat": "p95 do tempo de passo (s)",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Modo do HPA (label hpa-mode) e CPU-alvo",
          "type": "timeseries",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": ""
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_spec_target_metric{namespace=\"anomaly-lab\", horizontalpodautoscaler=\"fastapi-hpa\"}",
              "legendFormat": "{{metric_name}} {{metric_target_type}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": [
        "anomaly-lab",
        "online-detector",
        "hpa"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Detector Online & HPA",
      "uid": "anomaly-lab-online"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: anomaly-lab
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30030
  selector:
    app: grafana
