# =============================================================================
# Grafana Datasource ConfigMap (auto-provision Prometheus)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: anomaly-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
# =============================================================================
# Grafana Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: anomaly-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "anomalylab2026"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Viewer"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
# =============================================================================
# Dashboard Provider (auto-load dashboards from /var/lib/grafana/dashboards)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: anomaly-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
# =============================================================================
# Dashboard: Anomaly Detection Lab
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: anomaly-lab
data:
  anomaly-lab.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Latência p95 (segundos)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "s", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"anomaly-lab\"}[30s])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"anomaly-lab\"}[30s])) by (le))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ]
        },
        {
          "title": "CPU por Pod (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "percent", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"anomaly-lab\", container=\"fastapi\"}[30s])) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Memória por Pod (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "decmbytes", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=\"anomaly-lab\", container=\"fastapi\"}) by (pod) / 1024 / 1024",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Réplicas (HPA)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "orange" }, "custom": { "fillOpacity": 20 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "count(count by (pod) (container_memory_usage_bytes{namespace=\"anomaly-lab\", container=\"fastapi\"}))",
              "legendFormat": "pods running",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "fixed", "fixedColor": "red" }, "unit": "percent", "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\", status=~\"5..\"}[30s])) / clamp_min(sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])), 0.001) * 100",
              "legendFormat": "5xx error %",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Requests In Progress",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(http_requests_in_progress{namespace=\"anomaly-lab\"}) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request Rate por Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"anomaly-lab\"}[30s])) by (endpoint, method)",
              "legendFormat": "{{method}} {{endpoint}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["anomaly-lab", "kubernetes"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Anomaly Detection Lab",
      "uid": "anomaly-lab-main"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: anomaly-lab
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30030
  selector:
    app: grafana
